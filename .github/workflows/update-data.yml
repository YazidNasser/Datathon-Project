name: Update crime data

on:
  schedule:
    # Sundays at 19:00 UTC: noon in Vancouver in summer, 11 am in winter.
    # VPD republishes GeoDASH on Sunday mornings (about 10:15 am Vancouver time), so this runs after that.
    - cron: "0 19 * * 0"
  workflow_dispatch:   # also lets you run it by hand from the Actions tab

permissions:
  contents: write      # to commit the new data.json

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download VPD data and rebuild data.json
        run: python scripts/update_data.py

      - name: Commit data.json if it changed
        run: |
          if git diff --quiet -- web/data.json; then
            echo "No new data this week."
            exit 0
          fi
          latest=$(python -c 'import json; print(json.load(open("web/data.json"))["latestDate"])')
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add web/data.json
          git commit -m "Update crime data to $latest"
          git push
