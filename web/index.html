<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VanScene</title>
  <meta name="description" content="See where and when crime is reported in Vancouver, in plain language. Built from VPD open data.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2212 12 232 232%22%3E%3Cstyle%3E.b{fill:#16242b}@media (prefers-color-scheme:dark){.b{fill:#e4ecef}}%3C/style%3E%3Cpath class=%22b%22 d=%22M54.57 48.81A108 108 0 1 0 201.43 48.81L128 176Z%22/%3E%3Cpath fill=%22#d9607e%22 d=%22M128 95.98L88.46 27.5A108 108 0 0 1 167.54 27.5Z%22/%3E%3C/svg%3E">
  <script>
    // Pick light or dark before the page draws so it doesn't flash: the saved choice, else the device setting
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>

  <link rel="preload" href="data.json" as="fetch" crossorigin>   <!-- start the big download before the scripts load -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-head">
    <!-- The name's first letter is the mark: a V whose point is a map pin, holding a hotspot that heats up and cools down -->
    <div class="brand"><h1><span class="sr-only">VanScene</span><span class="wordmark" aria-hidden="true"><svg class="mark" viewBox="12 12 232 232"><defs><filter id="mark-glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="16"/></filter></defs><path class="v" d="M54.57 48.81A108 108 0 1 0 201.43 48.81L128 176Z"/><path class="glow" d="M128 95.98L88.46 27.5A108 108 0 0 1 167.54 27.5Z"/><path class="spot" d="M128 95.98L88.46 27.5A108 108 0 0 1 167.54 27.5Z"/></svg>VanScene</span></h1></div>
    <!-- The search sits here on wider screens; on phones placeSearch() moves it into the filter panel -->
    <div class="head-search" id="head-search">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search a neighbourhood" aria-label="Search a neighbourhood" autocomplete="off"
          role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="hood-list">
        <!-- Our own list rather than a <datalist>: browsers place and style those themselves, and some opened it off screen -->
        <ul class="suggest" id="hood-list" role="listbox" aria-label="Neighbourhoods" hidden></ul>
      </label>
    </div>
    <nav class="views" aria-label="View">
      <button type="button" data-view="map" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Map</button>
      <button type="button" data-view="compare" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="12" r="5"/><circle cx="16" cy="12" r="5"/></svg>Compare</button>
      <button type="button" data-view="trends" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Trends</button>
    </nav>
    <button type="button" class="theme-toggle" id="theme-toggle">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="app" id="app" data-view="map">
    <div id="map" role="application" aria-label="Map of Vancouver. Click to summarize an area."></div>

    <aside class="panel filters" id="filters" aria-label="Filters">
      <div class="filters-top" id="filters-top">
        <button type="button" class="filters-btn" id="filters-btn" aria-expanded="false" aria-controls="filters-body">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filters
        </button>
      </div>

      <div class="filters-body" id="filters-body">
        <fieldset>
          <legend class="lab">Year</legend>
          <div class="year-pick" id="years"></div>
          <p class="hint" id="year-hint"></p>
        </fieldset>
        <div>
          <label class="lab" for="type">Type of crime</label>
          <select id="type"></select>
        </div>
        <fieldset>
          <legend class="lab">Time of day</legend>
          <!-- A 24-hour track from 6 am round to 6 am: four equal parts (pick one or more), when reports happen drawn
               under them as bars you can click or drag across to pick single hours, then the hour marks -->
          <div class="day-track" id="time">
            <button type="button" class="all" data-time="any" disabled>All 24 hours</button>
            <button type="button" data-time="morning" aria-pressed="false" aria-label="Morning, 6 am to 12 pm">Morning</button>
            <button type="button" data-time="afternoon" aria-pressed="false" aria-label="Afternoon, 12 pm to 6 pm">Afternoon</button>
            <button type="button" data-time="evening" aria-pressed="false" aria-label="Evening, 6 pm to 12 am">Evening</button>
            <button type="button" data-time="overnight" aria-pressed="false" aria-label="Overnight, 12 am to 6 am">Overnight</button>
            <div class="track-bars" id="track-bars" role="group" aria-label="Hours of the day: click or drag across them to pick hours, or use the arrow keys and Enter"></div>
            <span class="tick" aria-hidden="true">6 am</span><span class="tick" aria-hidden="true">12 pm</span><span class="tick" aria-hidden="true">6 pm</span><span class="tick" aria-hidden="true">12 am</span>
          </div>
        </fieldset>
        <p class="citywide" id="citywide"></p>
      </div>

      <div class="legend" id="legend" role="img">
        <span class="lab" id="legend-title">Reported incidents</span>
        <div class="ramp"></div>
        <div class="ends"><span>Fewer</span><span>More</span></div>
        <p class="legend-note" id="legend-note" hidden>One type is shaded on the all-crime scale, so it looks lighter than all types together.</p>
      </div>
      <details class="about" id="about"><summary>About this data</summary><div id="about-body"></div></details>
    </aside>

    <aside class="panel area" id="area" aria-label="Area summary"></aside>
    <aside class="panel compare" id="compare" aria-label="Compare two areas"></aside>
    <aside class="panel trends" id="trends" aria-label="Trends"></aside>

    <div class="status show" id="status"><div><span class="spinner"></span>Loading crime data…</div></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <p class="sr-only" id="announce" aria-live="polite"></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js" integrity="sha384-mFKkGiGvT5vo1fEyGCD3hshDdKmW3wzXW/x+fWriYJArD0R3gawT6lMvLboM22c0" crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
